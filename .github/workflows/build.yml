name: Build SUCCO VST3

# ---------------------------------------------------------------------------
# CI workflow that builds the SUCCO VST3 plugin on Windows, macOS, and Linux.
# Artifacts (.vst3 bundles on Win/macOS, .vst3 + standalone on Linux) are
# uploaded on every push and tagged release.
# ---------------------------------------------------------------------------

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: SUCCO-Windows
            artifact_path: build/SUCCO_artefacts/VST3
            cmake_extra: '-G "Visual Studio 17 2022" -A x64'
          - os: macos-latest
            artifact_name: SUCCO-macOS-Universal
            artifact_path: build/SUCCO_artefacts/VST3
            cmake_extra: '-DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=10.15'
          - os: ubuntu-22.04
            artifact_name: SUCCO-Linux
            artifact_path: build/SUCCO_artefacts/VST3
            cmake_extra: ''

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Install build deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            cmake ninja-build \
            libasound2-dev libjack-jackd-dev libsndfile1-dev \
            libfreetype6-dev libx11-dev libxinerama-dev libxext-dev \
            libxrandr-dev libxcursor-dev libxcomposite-dev libxrender-dev \
            libwebkit2gtk-4.1-dev libcurl4-openssl-dev \
            pkg-config

      - name: Set up MSVC toolchain (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure CMake
        shell: bash
        run: |
          mkdir -p build
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DSUCCO_BUILD_VST3=ON \
            -DSUCCO_BUILD_STANDALONE=ON \
            -DSUCCO_COPY_PLUGIN_AFTER_BUILD=OFF \
            ${{ matrix.cmake_extra }}

      - name: Build
        shell: bash
        run: cmake --build build --config Release --parallel 4

      - name: List build artifacts
        shell: bash
        run: |
          echo "---- build/SUCCO_artefacts tree ----"
          find build -name '*.vst3' -print || true
          find build -name 'SUCCO*' -type d -print | head -50 || true
          ls -la build 2>/dev/null || true

      - name: Stage artifacts for upload
        shell: bash
        run: |
          mkdir -p staging
          # VST3 bundles
          if [ -d build/SUCCO_artefacts/VST3 ]; then
            cp -R build/SUCCO_artefacts/VST3 staging/
          fi
          if [ -d build/SUCCO_artefacts/Standalone ]; then
            cp -R build/SUCCO_artefacts/Standalone staging/
          fi
          if [ -d build/SUCCO_artefacts/AU ]; then
            cp -R build/SUCCO_artefacts/AU staging/
          fi
          ls -la staging || true

      - name: Zip artifacts (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path staging\* -DestinationPath SUCCO-${{ matrix.artifact_name }}.zip

      - name: Zip artifacts (macOS / Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cd staging && zip -r -X ../SUCCO-${{ matrix.artifact_name }}.zip ./* || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: SUCCO-*.zip
          retention-days: 30
          if-no-files-found: warn

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/**/*.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
