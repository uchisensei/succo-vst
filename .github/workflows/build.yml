name: Build SUCCO VST3

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: SUCCO-Windows
            cmake_extra: ''
          - os: macos-latest
            artifact_name: SUCCO-macOS-Universal
            cmake_extra: '-DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=10.15'
          - os: ubuntu-22.04
            artifact_name: SUCCO-Linux
            cmake_extra: ''

    steps:
      - uses: actions/checkout@v5

      - name: Install deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y cmake ninja-build libasound2-dev libjack-jackd2-dev libsndfile1-dev libfreetype6-dev libx11-dev libxinerama-dev libxext-dev libxrandr-dev libxcursor-dev libxcomposite-dev libxrender-dev libwebkit2gtk-4.1-dev pkg-config

      - name: Configure
        shell: bash
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release ${{ matrix.cmake_extra }}

      - name: Build
        shell: bash
        run: cmake --build build --config Release --parallel 4

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: build/SUCCO_artifacts/
          retention-days: 30
          if-no-files-found: warn
